name: Build VCam

# 发布 Release 资产需要写权限（仓库是 public，资产可匿名下载，方便设备直接 curl）
permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid xz
      timeout-minutes: 10

    - name: Install Theos
      run: |
        # 必须使用 roothide 版 theos，上游 theos 不支持 THEOS_PACKAGE_SCHEME=roothide
        git clone --recursive https://github.com/roothide/theos.git ~/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
      timeout-minutes: 10

    - name: Install iOS SDK
      run: |
        curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
        mkdir -p $HOME/theos/sdks
        tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
        echo "Installed SDKs:"
        ls $HOME/theos/sdks/
      timeout-minutes: 10
    - name: Fix postinst permission
      run: |
        chmod 755 layout/DEBIAN/postinst
        chmod 755 layout/DEBIAN/postrm
        
    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$HOME/theos/bin:$PATH
        make clean
        make package FINALPACKAGE=1 2>&1
        echo "Build complete. Packages:"
        ls -lh packages/ 2>/dev/null || echo "No packages dir"
      timeout-minutes: 15

    - name: Verify package control
      run: |
        DEB=$(ls packages/*.deb | head -1)
        echo "Package file: $DEB"
        CONTROL=$(ar t "$DEB" | grep control)
        ar p "$DEB" "$CONTROL" | tar -xzO ./control | tee /tmp/control
        ARCH=$(awk '/^Architecture:/{print $2}' /tmp/control)
        if [ "$ARCH" != "iphoneos-arm64e" ]; then
          echo "::error::deb 架构为 $ARCH，roothide 设备需要 iphoneos-arm64e（请确认 THEOS_PACKAGE_SCHEME=roothide 且使用了 roothide 版 theos）"
          exit 1
        fi
        echo "OK: roothide 包，架构 $ARCH"

    - name: Extract dylib
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "No deb found!"
          exit 1
        fi
        echo "Found: $DEB"
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb 2>/dev/null || dpkg-deb -x "$DEB" .
        # Try to find dylib in extracted contents
        find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        # If ar worked, try tar
        tar -xf data.tar* 2>/dev/null && find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        ls -lh

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: VCam-dylib
        path: output/VCam.dylib
        retention-days: 30

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: output/*.deb
        retention-days: 30

    # 固定 tag "latest"，每次 push 覆盖同一个 Release，避免堆积 tag。
    # 设备侧可直接下载（无需登录）：
    #   curl -L https://github.com/limign/ios-vcam/releases/download/latest/<deb文件名>
    - name: Publish release asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest build
        body: |
          自动构建产物 —— roothide 包（Architecture: iphoneos-arm64e）

          - commit: `${{ github.sha }}`
          - 仅适用于 roothide 越狱（Dopamine-roothide / roothide Bootstrap）
        files: output/*.deb
        make_latest: true
