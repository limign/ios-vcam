name: Build VCam

# 发布 Release 资产需要写权限（仓库是 public，资产可匿名下载，方便设备直接 curl）
permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid xz
      timeout-minutes: 10

    - name: Install Theos
      run: |
        # 必须使用 roothide 版 theos，上游 theos 不支持 THEOS_PACKAGE_SCHEME=roothide
        git clone --recursive https://github.com/roothide/theos.git ~/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
      timeout-minutes: 10

    - name: Install iOS SDK
      run: |
        curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
        mkdir -p $HOME/theos/sdks
        tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
        echo "Installed SDKs:"
        ls $HOME/theos/sdks/
      timeout-minutes: 10
    - name: Fix postinst permission
      run: |
        chmod 755 layout/DEBIAN/postinst
        chmod 755 layout/DEBIAN/postrm
        
    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$HOME/theos/bin:$PATH
        make clean
        # 不能用 `make ... | tee`：这台 runner 的 bash 没开 pipefail，管道的退出码会变成 tee 的 0，
        # make 失败了这一步也显示 success（上一轮就是这么被骗过去的）。所以自己捞 PIPESTATUS。
        make package FINALPACKAGE=1 2>&1 | tee /tmp/vcam-build.log
        rc=${PIPESTATUS[0]}
        echo "make 退出码: $rc"
        ls -lh packages/ 2>/dev/null || echo "No packages dir"
        exit $rc
      timeout-minutes: 15

    - name: Verify package control
      run: |
        DEB=$(ls packages/*.deb | head -1)
        echo "Package file: $DEB"
        CONTROL=$(ar t "$DEB" | grep control)
        ar p "$DEB" "$CONTROL" | tar -xzO ./control | tee /tmp/control
        ARCH=$(awk '/^Architecture:/{print $2}' /tmp/control)
        if [ "$ARCH" != "iphoneos-arm64e" ]; then
          echo "::error::deb 架构为 $ARCH，roothide 设备需要 iphoneos-arm64e（请确认 THEOS_PACKAGE_SCHEME=roothide 且使用了 roothide 版 theos）"
          exit 1
        fi
        echo "OK: roothide 包，架构 $ARCH"

    - name: Extract dylib
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "No deb found!"
          exit 1
        fi
        echo "Found: $DEB"
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb 2>/dev/null || dpkg-deb -x "$DEB" .
        # Try to find dylib in extracted contents
        find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        # If ar worked, try tar
        tar -xf data.tar* 2>/dev/null && find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        ls -lh

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: VCam-dylib
        path: output/VCam.dylib
        retention-days: 30

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: output/*.deb
        retention-days: 30

    # 固定 tag "latest"，每次 push 覆盖同一个 Release，避免堆积 tag。
    # 设备侧可直接下载（无需登录）：
    #   curl -L https://github.com/limign/ios-vcam/releases/download/latest/<deb文件名>
    - name: Publish release asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest build
        body: |
          自动构建产物 —— roothide 包（Architecture: iphoneos-arm64e）

          - commit: `${{ github.sha }}`
          - 仅适用于 roothide 越狱（Dopamine-roothide / roothide Bootstrap）
        files: output/*.deb
        make_latest: true

    # 失败时把编译日志写成 Release 资产发布出去。
    # 原因：Actions 的日志要登录才能看，而开发机是 Windows / 没有 iOS SDK，
    # 唯一能编译的就是 CI —— 不这么做，每次失败都得人工去网页上把日志贴回来。
    #
    # 通道用 Release 资产（tag ci-log，匿名可读），和 deb 的发布是同一条路，已经验证可行；
    # 试过 git push 到 ci-log 分支，那一步自己会失败，而且失败原因还看不到（鸡生蛋）。
    # 放在最后一步，任何环节失败都能捞到；每次覆盖同一个 tag，不碰 main 也不影响 latest。
    - name: Collect build log
      if: failure()
      run: |
        {
          printf '# 构建失败日志 commit %s\n\n```\n' "${{ github.sha }}"
          grep -v '^[[:space:]]*$' /tmp/vcam-build.log 2>/dev/null | tail -400
          printf '\n```\n\n## packages/ 目录\n\n```\n'
          ls -la packages/ 2>&1
          printf '\n```\n'
        } > ci-fail.md
        wc -l ci-fail.md

    - name: Publish build log
      if: failure()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ci-log
        name: CI failure log
        prerelease: true
        make_latest: false
        body: |
          构建失败时自动发布的编译日志（commit `${{ github.sha }}`）。
          设备侧/本地直接下载查看：
          `curl -L https://github.com/limign/ios-vcam/releases/download/ci-log/ci-fail.md`
        files: ci-fail.md
